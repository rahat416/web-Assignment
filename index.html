<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Periodic Table of the Elements</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#fff;
  color:#111;
}
.page{
  width:min(1500px,98vw);
  margin:20px auto 35px;
}
h1{
  text-align:center;
  font-family:Georgia,"Times New Roman",serif;
  font-size:30px;
  margin:8px 0 18px;
}
.table{
  display:grid;
  grid-template-columns:repeat(18,minmax(48px,1fr));
  grid-template-rows:repeat(7,78px);
  gap:4px;
}
.element{
  border:1.5px solid #222;
  padding:4px 3px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  line-height:1.05;
  min-width:0;
}
.num{font-size:10px;align-self:flex-start}
.symbol{font-size:21px;font-weight:700;margin:2px 0}
.name{font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.mass{font-size:8px;margin-top:2px}
.blank{border:none}
.s{background:#fff2a8}.a{background:#ffd28c}.t{background:#9fd7f5}
.p{background:#a9e8a1}.m{background:#c8f1d0}.n{background:#d7f4b7}
.h{background:#d7eaff}.g{background:#f5c6e8}
.l{background:#d9b7ee}.x{background:#c7c7c7}

.series{
  margin-top:18px;
  display:grid;
  grid-template-columns:100px repeat(15,minmax(48px,1fr));
  gap:4px;
}
.series-title{
  border:1.5px solid #222;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:700;
  font-size:11px;
  text-align:center;
  background:#eee;
}
.series .element{height:68px}
.legend{
  margin-top:18px;
  display:flex;
  flex-wrap:wrap;
  gap:8px 18px;
  justify-content:center;
  font-size:11px;
}
.legend span{display:flex;align-items:center;gap:5px}
.swatch{width:15px;height:15px;border:1px solid #333;display:inline-block}
.note{text-align:center;font-size:11px;color:#444;margin-top:10px}

@media(max-width:900px){
  .page{width:100%;overflow-x:auto;padding:0 8px}
  .table{width:1200px}
  .series{width:1200px}
  h1{font-size:24px}
}
</style>
</head>

function makeCell(sym, cls, row, col, target){
  const d=document.createElement("div");
  d.className="element "+cls;
  d.style.gridRow=row;
  d.style.gridColumn=col;
  d.innerHTML=`<span class="num">${atomic[sym]||""}</span><span class="symbol">${sym}</span><span class="name">${fullNames[sym]||""}</span><span class="mass">${mass[sym]||""}</span>`;
  target.appendChild(d);
}

  // Leave La/Ac positions as placeholders pointing to the separated rows.
  if(sym==="La" || sym==="Ac") return;
  makeCell(sym,cls,row,col,main);
});
